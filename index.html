<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reel Generator Test</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h2>Reel Generator API Tester</h2>
    <input type="text" id="promptInput" placeholder="Enter text prompt..." style="width: 300px; padding: 8px;">
    <button onclick="generateReel()" style="padding: 8px 15px;">Generate Reel</button>
    
    <p id="result"></p>

    <script>
        async function generateReel() {
            const prompt = document.getElementById('promptInput').value;
            document.getElementById('result').innerText = "Rendering reel... Please wait...";

            const response = await fetch('https://reel-render-pipeline.onrender.com/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt })
            });

            const data = await response.json();
            document.getElementById('result').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
